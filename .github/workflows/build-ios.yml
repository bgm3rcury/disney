name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          xcodebuild archive \
            -project DisneyQueues.xcodeproj \
            -scheme DisneyQueues \
            -configuration Release \
            -archivePath "$PWD/build/DisneyQueues.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/DisneyQueues.xcarchive/Products/Applications/DisneyQueues.app Payload/
          zip -r DisneyQueues.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisneyQueues-unsigned-ipa
          path: DisneyQueues.ipa