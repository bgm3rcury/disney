name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          set +e
          xcodebuild archive \
            -project DisneyQueues.xcodeproj \
            -scheme DisneyQueues \
            -configuration Release \
            -archivePath "$PWD/build/DisneyQueues.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::xcodebuild errors"
            grep -Ei "error:|failed|ARCHIVE FAILED|The following build commands failed|CompileSwift|SwiftCompile|actool|ibtool" xcodebuild.log | tail -n 80 || true
            echo "::endgroup::"
            errors=$(grep -Ei "error:|failed|ARCHIVE FAILED|The following build commands failed|CompileSwift|SwiftCompile|actool|ibtool" xcodebuild.log | tail -n 40)
            if [ -z "$errors" ]; then
              errors=$(tail -n 40 xcodebuild.log)
            fi
            message=$(printf "%s" "$errors" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=DisneyQueues.xcodeproj::xcodebuild failed%0A$message"
            exit "$status"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/DisneyQueues.xcarchive/Products/Applications/DisneyQueues.app Payload/
          zip -r DisneyQueues.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisneyQueues-unsigned-ipa
          path: DisneyQueues.ipa